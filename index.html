<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>アン・ドゥ・ドロワー</title>
<style>
  :root {
    --bg: #eef3f6; --panel: #ffffff; --panel-2: #f6f9fb;
    --ink: #3a4a54; --ink-soft: #7d909c; --line: #d6e1e8; --line-strong: #c3d2db;
    --accent: #4bb3d4; --accent-deep: #2f96b8; --accent-soft: #d9eef6; --warn: #e2795f;
    --shadow: 0 1px 0 #ffffff inset, 0 2px 6px rgba(60,90,110,.14); --radius: 9px;
  }
  :root[data-theme="dark"] {
    --bg: #1a2229; --panel: #232e37; --panel-2: #1e272f;
    --ink: #d6e2ea; --ink-soft: #8298a6; --line: #33414c; --line-strong: #3f515e;
    --accent: #4bb3d4; --accent-deep: #6bc7e4; --accent-soft: #24404c; --warn: #e2795f;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 6px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--ink); background: var(--bg); user-select: none; }
  body { display: flex; flex-direction: column; }

  header { height: 46px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2)); border-bottom: 1px solid var(--line); z-index: 30; }
  .logo { font-weight: 800; font-size: 16px; letter-spacing: .3px; color: var(--accent-deep); white-space: nowrap; }
  .logo small { font-size: 11px; color: var(--ink-soft); font-weight: 700; letter-spacing: 0; }
  .logo .dot { color: var(--warn); }
  .head-spacer { flex: 1; }
  .head-btn { height: 30px; padding: 0 12px; border: 1px solid var(--line-strong); background: var(--panel);
    color: var(--ink); border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
  .head-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .head-btn:active { transform: translateY(1px); }
  .head-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent-deep); }
  .head-btn.primary:hover { background: var(--accent-deep); }

  main { flex: 1; display: flex; min-height: 0; }

  .toolbar { width: 62px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; overflow-y: auto; z-index: 20; }
  .tool { width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--ink); }
  .tool svg { width: 22px; height: 22px; }
  .tool span { font-size: 8.5px; font-weight: 700; color: var(--ink-soft); }
  .tool:hover { background: var(--accent-soft); }
  .tool.active { background: var(--accent); border-color: var(--accent-deep); color: #fff; box-shadow: 0 2px 5px rgba(47,150,184,.4); }
  .tool.active span { color: rgba(255,255,255,.85); }
  .tool-sep { width: 34px; height: 1px; background: var(--line); margin: 3px 0; }

  .options { width: 220px; flex: none; background: var(--panel-2); border-right: 1px solid var(--line);
    padding: 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .opt-title { font-size: 12px; font-weight: 800; color: var(--ink-soft); letter-spacing: .3px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-row { display: flex; align-items: center; justify-content: space-between; }
  .field-row label { font-size: 12.5px; font-weight: 700; }
  .field-row .val { font-size: 12px; font-weight: 800; color: var(--accent-deep); min-width: 40px; text-align: right; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: var(--line); border-radius: 4px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; cursor: pointer; }

  .color-main { display: flex; align-items: center; gap: 10px; }
  .swatch-big { width: 46px; height: 46px; border-radius: 10px; border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line-strong), var(--shadow); cursor: pointer; }
  .color-inputs { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .color-inputs input[type="color"] { width: 100%; height: 26px; padding: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .hex { width: 100%; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel);
    color: var(--ink); font-size: 12px; font-weight: 700; text-align: center; text-transform: uppercase; font-family: ui-monospace, monospace; }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .palette .sw { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; position: relative; }
  .palette .sw:hover { transform: scale(1.12); }
  .palette .sw.empty { background: transparent !important; border: 1px dashed var(--line-strong); cursor: default; }
  .palette .sw.empty:hover { transform: none; }
  .palette .sw.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .palette.editing .sw:not(.empty)::after { content: "\00d7"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 14px; background: rgba(210,60,40,.55); border-radius: 4px; }
  .pal-label { font-size: 11px; font-weight: 800; color: var(--ink-soft); letter-spacing: .2px; margin-top: 2px; display: flex; align-items: center; justify-content: space-between; }
  .mini-btn { height: 22px; padding: 0 8px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
    border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .mini-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .mini-btn.on { background: var(--accent); color: #fff; border-color: var(--accent-deep); }

  .size-presets { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .size-presets button { height: 30px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .size-presets button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .size-presets button.active { border-color: var(--accent-deep); box-shadow: 0 0 0 1px var(--accent) inset; }
  .size-presets .dot { background: var(--ink); border-radius: 50%; }

  .shape-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .shape-btn { height: 46px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--ink); }
  .shape-btn svg { width: 26px; height: 20px; }
  .shape-btn span { font-size: 10px; font-weight: 800; color: var(--ink-soft); }
  .shape-btn:hover { background: var(--accent-soft); }
  .shape-btn.active { background: var(--accent); border-color: var(--accent-deep); color: #fff; }
  .shape-btn.active span { color: rgba(255,255,255,.85); }

  .toggle-btn { width: 100%; height: 32px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
    border-radius: 7px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .toggle-btn::before { content: ""; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--panel-2); flex: none; }
  .toggle-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .toggle-btn.on { background: var(--accent); color: #fff; border-color: var(--accent-deep); }
  .toggle-btn.on::before { background: #fff; border-color: #fff; content: "\2713"; color: var(--accent-deep); font-size: 11px; display: flex; align-items: center; justify-content: center; line-height: 1; }

  .stage { flex: 1; min-width: 0; position: relative; overflow: hidden;
    background: repeating-conic-gradient(var(--line) 0% 25%, transparent 0% 50%) 0 0 / 20px 20px, var(--panel-2); }
  /* inner wrapper: centers the canvas when small, and (being at least 100%) lets the
     scroll container reach every edge when the canvas is zoomed larger than the stage.
     Centering directly on an overflow scroll container clips the top/left, which broke panning. */
  .stage-inner { min-width: 100%; min-height: 100%; width: max-content; height: max-content; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 24px; }
  :root[data-theme="dark"] .stage { background: repeating-conic-gradient(#2b3640 0% 25%, transparent 0% 50%) 0 0 / 20px 20px, var(--panel-2); }
  .canvas-wrap { position: relative; box-shadow: 0 6px 24px rgba(40,70,90,.28), 0 0 0 1px var(--line-strong); background: #fff; flex: none; }
  .canvas-wrap canvas { position: absolute; top: 0; left: 0; display: block; touch-action: none; }
  #cursorLayer { pointer-events: none; }

  .nav-zoom { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .nav-zoom button { height: 28px; min-width: 30px; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink);
    font-size: 15px; font-weight: 800; cursor: pointer; border-radius: 6px; padding: 0 8px; }
  .nav-zoom button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .nav-zoom button:active { transform: translateY(1px); }
  .nav-zoom button#zoomFit { font-size: 12px; }
  .nav-zoom .z-val { font-size: 12px; font-weight: 800; min-width: 46px; text-align: center; color: var(--ink-soft); }

  .layers { width: 226px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .nav-panel { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .nav-wrap { display: flex; align-items: center; justify-content: center; min-height: 60px;
    background: repeating-conic-gradient(var(--line) 0% 25%, transparent 0% 50%) 0 0 / 12px 12px, var(--panel-2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px; }
  #navCanvas { display: block; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.18); background: #fff; }
  .layers-head { padding: 12px 14px 8px; display: flex; align-items: center; justify-content: space-between; }
  .layers-head .opt-title { margin: 0; }
  .layer-tools { display: flex; gap: 4px; padding: 0 10px 8px; flex-wrap: wrap; }
  .lt-btn { width: 30px; height: 30px; border: 1px solid var(--line-strong); background: var(--panel-2); border-radius: 7px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .lt-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .lt-btn:active { transform: translateY(1px); }
  .lt-btn svg { width: 16px; height: 16px; }
  .lt-btn.danger:hover { background: #fbe4dd; border-color: var(--warn); color: var(--warn); }

  .layer-opacity { padding: 4px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .layer-mode { width: 100%; height: 28px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel-2); color: var(--ink); font-size: 12px; font-weight: 700; padding: 0 6px; }

  .layer-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .layer-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
  .layer-item.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
  .layer-item.dragging { opacity: .4; }
  .layer-vis { width: 26px; height: 26px; flex: none; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel);
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; }
  .layer-vis.off { color: var(--ink-soft); opacity: .45; }
  .layer-vis svg { width: 15px; height: 15px; }
  .layer-thumb { width: 40px; height: 32px; flex: none; border-radius: 5px; border: 1px solid var(--line-strong);
    background-color: #fff; background-image: repeating-conic-gradient(#e6e6e6 0% 25%, #fff 0% 50%); background-size: 10px 10px; overflow: hidden; }
  .layer-thumb canvas { width: 100%; height: 100%; display: block; }
  .layer-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer-name input { width: 100%; border: 1px solid var(--accent); border-radius: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 4px; background: var(--panel); color: var(--ink); }
  .drag-handle { color: var(--ink-soft); cursor: grab; flex: none; display: flex; align-items: center; justify-content: center;
    touch-action: none; width: 22px; height: 32px; margin: -6px 0 -6px -2px; }
  .drag-handle:active { cursor: grabbing; }
  .layer-item.drop-above { box-shadow: inset 0 3px 0 var(--accent-deep); }
  .layer-item.drop-below { box-shadow: inset 0 -3px 0 var(--accent-deep); }
  .layer-ref { width: 20px; height: 20px; flex: none; border-radius: 5px; border: 1.5px solid var(--line-strong); background: var(--panel);
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: transparent; }
  .layer-ref:hover { border-color: var(--accent); background: var(--accent-soft); }
  .layer-ref.on { background: var(--accent); border-color: var(--accent-deep); color: #fff; }
  .layer-ref.on::after { content: "\2713"; }
  .layer-hint { font-size: 10.5px; line-height: 1.4; color: var(--ink-soft); padding: 0 12px 8px; }
  .layer-hint b { color: var(--accent-deep); }
  .drag-handle svg { width: 14px; height: 14px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff;
    padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* player overlay */
  .player { position: fixed; inset: 0; background: rgba(20,30,38,.82); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
  .player.open { display: flex; }
  .player-box { background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); max-width: 94vw; max-height: 94vh; display: flex; flex-direction: column; }
  .player-top { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .player-top .opt-title { margin: 0; font-size: 14px; color: var(--ink); }
  .player-canvas { background: repeating-conic-gradient(#e6e6e6 0% 25%, #fff 0% 50%) 0 0 / 16px 16px; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
  .player-canvas canvas { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.25); max-width: 78vw; max-height: 64vh; }
  .player-ctrl { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pbtn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .pbtn.main { background: var(--accent); color: #fff; border-color: var(--accent-deep); width: 46px; height: 46px; font-size: 18px; }
  .seek { flex: 1; min-width: 160px; }
  .ptime { font-size: 12px; font-weight: 800; color: var(--ink-soft); min-width: 92px; text-align: center; font-family: ui-monospace, monospace; }
  .pspeed { height: 32px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); font-weight: 700; font-size: 12px; padding: 0 6px; }

  .modal { position: fixed; inset: 0; background: rgba(20,30,38,.55); z-index: 210; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-box { background: var(--panel); border-radius: 14px; padding: 18px; width: 300px; max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 12px; }
  .rz-row { display: flex; align-items: center; gap: 8px; }
  .rz-row label { width: 40px; font-weight: 700; font-size: 13px; }
  .rz-row input { flex: 1; height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel-2); color: var(--ink); font-size: 15px; font-weight: 700; text-align: center; }
  .rz-row span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .rz-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rz-presets button { height: 30px; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .rz-presets button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .rz-note { font-size: 11px; color: var(--ink-soft); }
  .rz-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .mobile-toggle { display: none; }
  @media (max-width: 860px) {
    .options { position: absolute; left: 62px; top: 0; bottom: 0; z-index: 25; box-shadow: 6px 0 18px rgba(0,0,0,.15); transform: translateX(-110%); transition: transform .2s; }
    .options.open { transform: translateX(0); }
    .layers { position: absolute; right: 0; top: 0; bottom: 0; z-index: 25; box-shadow: -6px 0 18px rgba(0,0,0,.15); transform: translateX(110%); transition: transform .2s; }
    .layers.open { transform: translateX(0); }
    .mobile-toggle { display: inline-flex; }
    .logo { font-size: 13px; }
    .head-btn { padding: 0 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">アン・ドゥ・ドロワー</div>
  <button class="head-btn mobile-toggle" id="toggleOptions" title="ツール設定">&#9881;</button>
  <div class="head-spacer"></div>
  <button class="head-btn" id="undoBtn" title="元に戻す (Ctrl+Z)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>
  <button class="head-btn" id="redoBtn" title="やり直し (Ctrl+Y)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
  </button>
  <button class="head-btn" id="clearBtn" title="このレイヤーを消す">クリア</button>
  <button class="head-btn" id="themeBtn" title="テーマ切替">&#127769;</button>
  <button class="head-btn" id="openBtn" title="PNGを開く(過程つきなら再生)">ひらく</button>
  <button class="head-btn primary" id="saveBtn" title="過程を埋め込んだPNGを保存">PNG保存</button>
  <button class="head-btn mobile-toggle" id="toggleLayers" title="レイヤー">&#9636;</button>
  <input type="file" id="fileInput" accept="image/png,image/*" style="display:none">
</header>

<main>
  <div class="toolbar" id="toolbar">
    <button class="tool active" data-tool="pen" title="ペン (B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span>ペン</span>
    </button>
    <button class="tool" data-tool="pencil" title="えんぴつ (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>えんぴつ</span>
    </button>
    <button class="tool" data-tool="brush" title="水彩 (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg><span>水彩</span>
    </button>
    <button class="tool" data-tool="airbrush" title="エアブラシ (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="1.3"/><circle cx="7" cy="9" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="9" cy="16" r="1"/><circle cx="17" cy="15" r="1"/><circle cx="6" cy="14" r=".9"/><circle cx="13" cy="6" r=".9"/><circle cx="15" cy="18" r=".8"/></svg><span>エアブラシ</span>
    </button>
    <button class="tool" data-tool="marker" title="マーカー (M)">

  <div class="layers" id="layers">
    <div class="nav-panel">

    <div class="layer-tools">
      <button class="lt-btn" id="addLayer" title="新規レイヤー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="player" id="player">

<script>
"use strict";
(function () {
  let CW = 720, CH = 540, zoom = 1;
  const MAX_HISTORY = 40;

  const stage = document.getElementById('stage');
  const wrap = document.getElementById('canvasWrap');
  const composite = document.getElementById('composite');
  const input = document.getElementById('inputCanvas');
  const cursorLayer = document.getElementById('cursorLayer');
  const cctx = composite.getContext('2d');
  const curctx = cursorLayer.getContext('2d');
  const tmp = document.createElement('canvas'); let tctx;   // scratch for compositing
  // wet stroke lives on an OFF-SCREEN canvas so the visible layers only ever show
  // the composited result (at tool opacity). The DOM #inputCanvas captures pointer
  // events only and is never drawn on.
  const wet = document.createElement('canvas'); let wctx;
  const navCanvas = document.getElementById('navCanvas'); const nctx = navCanvas.getContext('2d'); let navScale = 1;

  let layers = [], activeId = null, layerSeq = 0;
  const history = []; let histIndex = -1;
  const tool = { name:'pen', color:'#3a4a54', size:8, opacity:1, smooth:3, shape:'round', angle:45, binary:false };

  // 2値化: 指定領域のアルファを閾値でオン/オフに(アンチエイリアスの縁を消す)
  const BIN_TOOLS=['pen','pencil','marker','eraser'];
  function thresholdRegion(ctx, x, y, w, h, thr){
    x=Math.max(0,Math.floor(x)); y=Math.max(0,Math.floor(y));
    w=Math.min(CW-x,Math.ceil(w)); h=Math.min(CH-y,Math.ceil(h));
    if(w<=0||h<=0)return;
    const img=ctx.getImageData(x,y,w,h), d=img.data, t=thr||128;
    for(let i=3;i<d.length;i+=4){ d[i]=d[i]>=t?255:0; }
    ctx.putImageData(img,x,y);
  }
  function segBBox(a,b,size){ const pad=size/2+2; return { x:Math.min(a.x,b.x)-pad, y:Math.min(a.y,b.y)-pad, w:Math.abs(a.x-b.x)+pad*2, h:Math.abs(a.y-b.y)+pad*2 }; }

  // recording of the drawing process
  let record = { v:1, w:CW, h:CH, layers:[], events:[] };
  let curStroke = null;
  let recordedThisAction = false;   // このアクションで過程イベントを記録したか
  // 過程イベントは履歴(undo/redo)と同期させる。undoで取り消した操作は再生から除外する。
  function branchBase(){ return (histIndex>=0 && history[histIndex]) ? (history[histIndex].evLen||0) : record.events.length; }
  function recordEvent(ev){ if(!recordedThisAction){ record.events.length = branchBase(); } record.events.push(ev); recordedThisAction=true; }
  function currentEvents(){ const n = (histIndex>=0 && history[histIndex] && history[histIndex].evLen!=null) ? history[histIndex].evLen : record.events.length; return record.events.slice(0,n); }

  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400); }
  function activeLayer(){ return layers.find(l=>l.id===activeId); }
  function hexToRgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

  // ---------- stroke rendering (shared by live + playback) ----------
  function seg(ctx,a,b,w,alpha){ ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=w;
    if(alpha!=null)ctx.globalAlpha=alpha; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore(); }

  // flat/chisel nib: stamp a rotated rectangle densely along the segment
  function flatSeg(ctx,color,size,a,b,angleDeg,thickRatio,alpha){
    const ang=(angleDeg||0)*Math.PI/180, half=size/2, thick=Math.max(1.2,size*(thickRatio||0.45));
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    const steps=Math.max(1,Math.ceil(len/Math.max(0.6,thick*0.35)));
    ctx.save(); ctx.fillStyle=color; if(alpha!=null)ctx.globalAlpha=alpha;
    for(let i=0;i<=steps;i++){ const t=steps?i/steps:0, x=a.x+dx*t, y=a.y+dy*t;
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillRect(-half,-thick/2,size,thick); ctx.restore(); }
    ctx.restore();
  }

  // draw ONE segment of a stroke onto a wet canvas (full alpha), by tool
  function wetSeg(ctx, tname, color, size, a, b, shape, angle){
    ctx.strokeStyle=color; ctx.fillStyle=color;
    if(shape==='flat'){
      if(tname==='pencil'){ flatSeg(ctx,color,Math.max(1,size*0.7),a,b,angle,0.4); }
      else if(tname==='brush'){ flatSeg(ctx,color,size,a,b,angle,0.5); flatSeg(ctx,color,size*1.5,a,b,angle,0.5,0.16); }
      else { flatSeg(ctx,color,size,a,b,angle,0.45); }
      return;
    }
    if(tname==='pen'||tname==='marker'||tname==='eraser'){ seg(ctx,a,b,size); }
    else if(tname==='pencil'){ seg(ctx,a,b,Math.max(1,size*0.6)); }
    else if(tname==='brush'){ seg(ctx,a,b,size); seg(ctx,a,b,size*1.6,0.18); }
  }
  function airStampInto(ctx,color,size,p,seed){
    const r=size/2, density=Math.max(4,r*1.2);
    ctx.save(); ctx.fillStyle=color;
    let s = seed||1;
    const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
    for(let i=0;i<density;i++){ const ang=rnd()*Math.PI*2, rad=rnd()*r;
      ctx.globalAlpha=0.06+rnd()*0.06; ctx.beginPath();
      ctx.arc(p.x+Math.cos(ang)*rad, p.y+Math.sin(ang)*rad, Math.max(0.5,size*0.04),0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  // ---------- layers ----------
  function makeLayer(name){ const c=document.createElement('canvas'); c.width=CW; c.height=CH;
    return { id:++layerSeq, name:name||('レイヤー '+layerSeq), canvas:c, ctx:c.getContext('2d'), visible:true, opacity:1, mode:'source-over', ref:false }; }
  function addLayer(opts){ const l=makeLayer(opts&&opts.name); const idx=layers.findIndex(x=>x.id===activeId);
    if(idx===-1)layers.push(l); else layers.splice(idx+1,0,l); activeId=l.id; renderLayerList(); redraw(); return l; }

  function redraw(){ cctx.clearRect(0,0,CW,CH);
    for(const l of layers){ if(!l.visible||l.opacity<=0)continue; cctx.globalAlpha=l.opacity; cctx.globalCompositeOperation=l.mode; cctx.drawImage(l.canvas,0,0); }
    cctx.globalAlpha=1; cctx.globalCompositeOperation='source-over'; scheduleNav(); }

  // live preview: composite with the wet stroke folded into the active layer at tool opacity + layer mode
  function previewComposite(){
    cctx.clearRect(0,0,CW,CH);
    for(const l of layers){
      if(!l.visible||l.opacity<=0)continue;
      cctx.globalAlpha=l.opacity; cctx.globalCompositeOperation=l.mode;
      if(l.id===activeId && drawing){
        tctx.clearRect(0,0,CW,CH);
        tctx.drawImage(l.canvas,0,0);
        tctx.save();
        tctx.globalAlpha=tool.opacity;
        tctx.globalCompositeOperation=(tool.name==='eraser')?'destination-out':'source-over';
        tctx.drawImage(wet,0,0);
        tctx.restore();
        cctx.drawImage(tmp,0,0);
      } else {
        cctx.drawImage(l.canvas,0,0);
      }
    }
    cctx.globalAlpha=1; cctx.globalCompositeOperation='source-over'; scheduleNav();
  }

  // preview while dragging the active layer's pixels with the move tool
  function previewMove(){
    cctx.clearRect(0,0,CW,CH);
    for(const l of layers){
      if(!l.visible||l.opacity<=0)continue;
      cctx.globalAlpha=l.opacity; cctx.globalCompositeOperation=l.mode;
      if(moving && l.id===moving.lid){ cctx.drawImage(moving.snap, moving.dx, moving.dy); }
      else cctx.drawImage(l.canvas,0,0);
    }
    cctx.globalAlpha=1; cctx.globalCompositeOperation='source-over'; scheduleNav();
  }
  function commitMove(){
    const l=layers.find(x=>x.id===moving.lid);
    const dx=Math.round(moving.dx*2)/2, dy=Math.round(moving.dy*2)/2;
    if(l && (dx!==0 || dy!==0)){
      l.ctx.clearRect(0,0,CW,CH); l.ctx.drawImage(moving.snap,dx,dy); updateThumb(l);
      recordEvent({t:'move',lid:l.id,dx,dy});
      moving=null; redraw(); pushHistory();
    } else { moving=null; redraw(); }
  }
  // ---------- navigator / preview ----------
  function layoutNav(){ const NAVW=196, NAVH=170; navScale=Math.min(NAVW/CW, NAVH/CH);
    const w=Math.max(1,Math.round(CW*navScale)), h=Math.max(1,Math.round(CH*navScale));
    navCanvas.width=w; navCanvas.height=h; navCanvas.style.width=w+'px'; navCanvas.style.height=h+'px'; }
  let navPending=false;
  function scheduleNav(){ if(navPending)return; navPending=true; requestAnimationFrame(()=>{ navPending=false; updatePreview(); }); }
  function updatePreview(){ const w=navCanvas.width, h=navCanvas.height; if(!w||!h)return;
    nctx.clearRect(0,0,w,h); nctx.fillStyle='#ffffff'; nctx.fillRect(0,0,w,h);
    nctx.drawImage(composite,0,0,w,h);
    // viewport rectangle: visible image region, computed from actual rendered positions
    const sr=stage.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
    const vx=(sr.left-wr.left)/zoom, vy=(sr.top-wr.top)/zoom, vw=sr.width/zoom, vh=sr.height/zoom;
    const x0=Math.max(0,vx), y0=Math.max(0,vy), x1=Math.min(CW,vx+vw), y1=Math.min(CH,vy+vh);
    if(x1>x0 && y1>y0 && (x0>0.5||y0>0.5||x1<CW-0.5||y1<CH-0.5)){
      const rx=x0*navScale, ry=y0*navScale, rw=(x1-x0)*navScale, rh=(y1-y0)*navScale;
      nctx.strokeStyle='rgba(0,0,0,.6)'; nctx.lineWidth=2; nctx.strokeRect(rx,ry,rw,rh);
      nctx.strokeStyle='rgba(255,255,255,.95)'; nctx.lineWidth=1; nctx.strokeRect(rx,ry,rw,rh);
    }
  }
  let navDragging=false;
  function navPanTo(clientX,clientY){ const r=navCanvas.getBoundingClientRect();
    const ix=(clientX-r.left)/navScale, iy=(clientY-r.top)/navScale;      // カーソル下の画像座標
    const vw=stage.clientWidth/zoom, vh=stage.clientHeight/zoom;           // 見えている画像範囲(画像px)
    const left=Math.max(0, Math.min(Math.max(0,CW-vw), ix-vw/2));          // 表示範囲をキャンバス内にクランプ
    const top =Math.max(0, Math.min(Math.max(0,CH-vh), iy-vh/2));
    const PAD=24;   // .stage-inner の padding と一致
    stage.scrollLeft = PAD + left*zoom;
    stage.scrollTop  = PAD + top*zoom;
    scheduleNav();
  }
  navCanvas.addEventListener('pointerdown',e=>{ navDragging=true; navCanvas.setPointerCapture&&navCanvas.setPointerCapture(e.pointerId); navPanTo(e.clientX,e.clientY); });
  navCanvas.addEventListener('pointermove',e=>{ if(navDragging)navPanTo(e.clientX,e.clientY); });
  navCanvas.addEventListener('pointerup',()=>{ navDragging=false; });
  navCanvas.addEventListener('pointercancel',()=>{ navDragging=false; });
  window.addEventListener('resize',scheduleNav);

  function applyZoom(){ const w=Math.round(CW*zoom),h=Math.round(CH*zoom); wrap.style.width=w+'px'; wrap.style.height=h+'px';
    [composite,input,cursorLayer].forEach(cv=>{cv.style.width=w+'px'; cv.style.height=h+'px';}); document.getElementById('zoomVal').textContent=Math.round(zoom*100)+'%'; scheduleNav(); }
  function setCanvasSize(){ [composite,input,cursorLayer].forEach(cv=>{cv.width=CW; cv.height=CH;}); tmp.width=CW; tmp.height=CH; tctx=tmp.getContext('2d'); wet.width=CW; wet.height=CH; wctx=wet.getContext('2d'); layoutNav(); applyZoom(); }
  function fitZoom(){ const pad=48; zoom=Math.max(0.1,Math.min((stage.clientWidth-pad)/CW,(stage.clientHeight-pad)/CH,1)); applyZoom(); }

  // ---------- history ----------
  function snapshot(){ return { activeId, layers: layers.map(l=>{ const c=document.createElement('canvas'); c.width=CW; c.height=CH; c.getContext('2d').drawImage(l.canvas,0,0);
    return {id:l.id,name:l.name,canvas:c,visible:l.visible,opacity:l.opacity,mode:l.mode,ref:l.ref}; }) }; }
  function pushHistory(){
    if(!recordedThisAction){ record.events.length = branchBase(); }  // 分岐時、取り消された未来のイベントを破棄
    recordedThisAction=false;
    history.splice(histIndex+1);
    const snap=snapshot(); snap.evLen=record.events.length;
    history.push(snap); if(history.length>MAX_HISTORY)history.shift(); histIndex=history.length-1; updateUndoRedo();
  }
  function restore(s){ layers=s.layers.map(sl=>{ const c=document.createElement('canvas'); c.width=CW; c.height=CH; const ctx=c.getContext('2d'); ctx.drawImage(sl.canvas,0,0);
    return {id:sl.id,name:sl.name,canvas:c,ctx,visible:sl.visible,opacity:sl.opacity,mode:sl.mode,ref:!!sl.ref}; }); activeId=s.activeId;
    if(!activeLayer()&&layers.length)activeId=layers[layers.length-1].id; renderLayerList(); redraw(); syncLayerControls(); }
  function undo(){ if(histIndex>0){ histIndex--; restore(history[histIndex]); updateUndoRedo(); toast('元に戻す'); } }
  function redo(){ if(histIndex<history.length-1){ histIndex++; restore(history[histIndex]); updateUndoRedo(); toast('やり直し'); } }
  function updateUndoRedo(){ document.getElementById('undoBtn').style.opacity=histIndex>0?1:.4; document.getElementById('redoBtn').style.opacity=histIndex<history.length-1?1:.4; }

  // ---------- drawing ----------
  let drawing=false, lastP=null, smoothP=null, panning=false, panStart=null, scrollStart=null, airTimer=null, airPos=null, airSeed=1, moving=null, spaceDown=false;

  function getPos(e){ const r=input.getBoundingClientRect(); return { x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom }; }
  const isDrawTool = n => ['pen','pencil','brush','airbrush','marker','eraser'].includes(n);

  function pointerDown(e){
    const p=getPos(e);
    if(e.button===1||spaceDown){ panning=true; panStart={x:e.clientX,y:e.clientY}; scrollStart={x:stage.scrollLeft,y:stage.scrollTop}; return; }
    if(tool.name==='move'){ const l=activeLayer(); if(!l||!l.visible){ toast(l?'レイヤーが非表示です':'レイヤーがありません'); return; }
      const snap=document.createElement('canvas'); snap.width=CW; snap.height=CH; snap.getContext('2d').drawImage(l.canvas,0,0);
      moving={lid:l.id, snap, sx:p.x, sy:p.y, dx:0, dy:0};
      input.setPointerCapture&&input.setPointerCapture(e.pointerId); return; }
    if(tool.name==='eyedropper'){ pickColor(p); return; }
    if(tool.name==='fill'){ const l=activeLayer(); if(l){ pushHistory();
      const fx=Math.floor(p.x), fy=Math.floor(p.y);
      const refs=layers.filter(x=>x.ref && x.visible);
      const refIds=refs.map(x=>x.id);
      const matchCanvas = refs.length ? buildRefCanvas(refs,CW,CH) : l.canvas;
      bucketFill(matchCanvas, l.ctx, fx, fy, tool.color, tool.opacity, CW, CH);
      recordEvent({t:'fill',lid:l.id,color:tool.color,op:tool.opacity,x:fx,y:fy,refIds:refIds});
      redraw(); updateThumb(l); } return; }

    const l=activeLayer(); if(!l||!l.visible){ toast(l?'レイヤーが非表示です':'レイヤーがありません'); return; }
    drawing=true; input.setPointerCapture&&input.setPointerCapture(e.pointerId);
    lastP=p; smoothP={x:p.x,y:p.y}; wctx.clearRect(0,0,CW,CH);
    airSeed=(Math.random()*100000)|0;
    const binOn = tool.binary && BIN_TOOLS.includes(tool.name);
    curStroke={ t:'st', lid:l.id, tool:tool.name, color:tool.color, size:tool.size, op:tool.opacity, seed:airSeed,
      shape:tool.shape, angle:tool.angle, binary:binOn, pts:[Math.round(p.x*2)/2,Math.round(p.y*2)/2] };

    if(tool.name==='airbrush'){ airPos=p; airStampInto(wctx,tool.color,tool.size,p,airSeed); airSeed++; 
      airTimer=setInterval(()=>{ if(airPos){ airStampInto(wctx,tool.color,tool.size,airPos,airSeed++); previewComposite(); } },45);
    } else { wctx.strokeStyle=tool.color; wctx.fillStyle=tool.color; wetSeg(wctx,tool.name,tool.color,tool.size,p,{x:p.x+0.01,y:p.y},tool.shape,tool.angle);
      if(binOn){ const bb=segBBox(p,p,tool.size); thresholdRegion(wctx,bb.x,bb.y,bb.w,bb.h); } }
    previewComposite();
  }

  function pointerMove(e){
    if(panning){ stage.scrollLeft=scrollStart.x-(e.clientX-panStart.x); stage.scrollTop=scrollStart.y-(e.clientY-panStart.y); scheduleNav(); return; }
    if(moving){ const q=getPos(e); moving.dx=q.x-moving.sx; moving.dy=q.y-moving.sy; previewMove(); return; }
    const p=getPos(e); drawCursor(p);
    if(!drawing)return;
    const s=tool.smooth; let np;
    if(s>0){ const f=1/(1+s*0.6); smoothP.x+=(p.x-smoothP.x)*f; smoothP.y+=(p.y-smoothP.y)*f; np={x:smoothP.x,y:smoothP.y}; } else np=p;
    // throttle points by distance
    const last={x:curStroke.pts[curStroke.pts.length-2],y:curStroke.pts[curStroke.pts.length-1]};
    const dist=Math.hypot(np.x-last.x,np.y-last.y);
    if(tool.name==='airbrush'){ airPos=np; if(dist>=2){ curStroke.pts.push(Math.round(np.x*2)/2,Math.round(np.y*2)/2); } return; }
    if(dist<1.2) return;
    wctx.strokeStyle=tool.color; wctx.fillStyle=tool.color;
    wetSeg(wctx,tool.name,tool.color,tool.size,lastP,np,tool.shape,tool.angle);
    if(curStroke.binary){ const bb=segBBox(lastP,np,tool.size); thresholdRegion(wctx,bb.x,bb.y,bb.w,bb.h); }
    lastP=np; curStroke.pts.push(Math.round(np.x*2)/2,Math.round(np.y*2)/2);
    previewComposite();
  }

  function pointerUp(){
    if(panning){ panning=false; return; }
    if(moving){ commitMove(); return; }
    if(!drawing)return; drawing=false;
    if(airTimer){ clearInterval(airTimer); airTimer=null; airPos=null; }
    const l=activeLayer();
    if(l){ l.ctx.save(); l.ctx.globalAlpha=tool.opacity; l.ctx.globalCompositeOperation=(tool.name==='eraser')?'destination-out':'source-over';
      l.ctx.drawImage(wet,0,0); l.ctx.restore(); updateThumb(l); }
    wctx.clearRect(0,0,CW,CH); redraw();
    if(curStroke && curStroke.pts.length>=2){ recordEvent(curStroke); }
    curStroke=null;
    pushHistory();
  }

  function drawCursor(p){
    curctx.clearRect(0,0,CW,CH);
    if(!isDrawTool(tool.name)) return;
    const r=Math.max(1,tool.size/2);
    curctx.save(); curctx.lineWidth=1/zoom;
    if(tool.shape==='flat' && tool.name!=='airbrush'){
      const thick=Math.max(1.2,tool.size*0.45);
      curctx.translate(p.x,p.y); curctx.rotate(tool.angle*Math.PI/180);
      curctx.strokeStyle='rgba(0,0,0,.55)'; curctx.strokeRect(-r,-thick/2,tool.size,thick);
      curctx.strokeStyle='rgba(255,255,255,.8)'; curctx.strokeRect(-r-1/zoom,-thick/2-1/zoom,tool.size+2/zoom,thick+2/zoom);
    } else {
      curctx.strokeStyle='rgba(0,0,0,.55)'; curctx.beginPath(); curctx.arc(p.x,p.y,r,0,Math.PI*2); curctx.stroke();
      curctx.strokeStyle='rgba(255,255,255,.8)'; curctx.beginPath(); curctx.arc(p.x,p.y,r+1/zoom,0,Math.PI*2); curctx.stroke();
      if(r*zoom<4){ curctx.fillStyle='rgba(0,0,0,.5)'; curctx.beginPath(); curctx.arc(p.x,p.y,0.8/zoom,0,Math.PI*2); curctx.fill(); }
    }
    curctx.restore();
  }
  input.addEventListener('pointerleave',()=>curctx.clearRect(0,0,CW,CH));

  function pickColor(p){ const x=Math.floor(p.x),y=Math.floor(p.y); const d=cctx.getImageData(x,y,1,1).data;
    if(d[3]===0){ toast('透明です'); return; }
    const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''); setColor(hex); toast('色を取得: '+hex.toUpperCase()); }

  // bucket fill. matchCanvas = 境界判定に使う画像(参照), destCtx = 実際に塗る先.
  // 参照レイヤーが無いときは matchCanvas===描画先レイヤー を渡せば従来どおり。
  function bucketFill(matchCanvas, destCtx, sx, sy, colorHex, opacity, w, h){
    if(sx<0||sy<0||sx>=w||sy>=h)return;
    const mdata=matchCanvas.getContext('2d').getImageData(0,0,w,h).data;
    const dimg=destCtx.getImageData(0,0,w,h), ddata=dimg.data;
    const t=(sy*w+sx)*4, tr=mdata[t],tg=mdata[t+1],tb=mdata[t+2],ta=mdata[t+3];
    const [fr,fg,fb]=hexToRgb(colorHex), fa=Math.round(opacity*255);
    const tol=32;
    const matches=p=>{ const i=p*4; return Math.abs(mdata[i]-tr)<=tol&&Math.abs(mdata[i+1]-tg)<=tol&&Math.abs(mdata[i+2]-tb)<=tol&&Math.abs(mdata[i+3]-ta)<=tol; };
    const visited=new Uint8Array(w*h);
    const stack=[[sx,sy]];
    while(stack.length){ let [cx,cy]=stack.pop(); let p=cy*w+cx;
      while(cy>=0 && !visited[p] && matches(p)){ cy--; p-=w; }
      cy++; p+=w; let spanL=false,spanR=false;
      while(cy<h && !visited[p] && matches(p)){
        visited[p]=1; const di=p*4; ddata[di]=fr;ddata[di+1]=fg;ddata[di+2]=fb;ddata[di+3]=fa;
        if(cx>0){ const lp=p-1; if(!visited[lp]&&matches(lp)){ if(!spanL){stack.push([cx-1,cy]);spanL=true;} } else spanL=false; }
        if(cx<w-1){ const rp=p+1; if(!visited[rp]&&matches(rp)){ if(!spanR){stack.push([cx+1,cy]);spanR=true;} } else spanR=false; }
        cy++; p+=w;
      }
    }
    destCtx.putImageData(dimg,0,0);
  }
  // 参照レイヤー(ref=true かつ表示中)を1枚に合成した境界判定用キャンバスを作る
  function buildRefCanvas(layerList, w, h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d');
    for(const l of layerList) cx.drawImage(l.canvas,0,0); return c; }

  // ---------- layer list ----------
  function renderLayerList(){
    const list=document.getElementById('layerList'); list.innerHTML='';
    for(let i=layers.length-1;i>=0;i--){ const l=layers[i];
      const item=document.createElement('div'); item.className='layer-item'+(l.id===activeId?' active':''); item.dataset.id=l.id;
      const handle=document.createElement('div'); handle.className='drag-handle'; handle.title='ドラッグで並べ替え';
      handle.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>';
      const vis=document.createElement('div'); vis.className='layer-vis'+(l.visible?'':' off');
      vis.innerHTML=l.visible?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
      vis.addEventListener('click',ev=>{ ev.stopPropagation(); l.visible=!l.visible; renderLayerList(); redraw(); pushHistory(); });
      const thumbBox=document.createElement('div'); thumbBox.className='layer-thumb';
      const tc=document.createElement('canvas'); tc.width=40; tc.height=32; tc.getContext('2d').drawImage(l.canvas,0,0,40,32); thumbBox.appendChild(tc); l._thumb=tc;
      const name=document.createElement('div'); name.className='layer-name'; name.textContent=l.name;
      name.addEventListener('dblclick',ev=>{ ev.stopPropagation(); const inp=document.createElement('input'); inp.value=l.name; name.textContent=''; name.appendChild(inp); inp.focus(); inp.select();
        const done=()=>{ l.name=inp.value.trim()||l.name; renderLayerList(); }; inp.addEventListener('blur',done); inp.addEventListener('keydown',k=>{if(k.key==='Enter')inp.blur();}); });
      const ref=document.createElement('div'); ref.className='layer-ref'+(l.ref?' on':''); ref.title='塗りつぶしの参照にする（この線を境界として使う）';
      ref.addEventListener('click',ev=>{ ev.stopPropagation(); l.ref=!l.ref; renderLayerList(); });
      item.appendChild(handle); item.appendChild(vis); item.appendChild(thumbBox); item.appendChild(name); item.appendChild(ref);
      item.addEventListener('click',()=>{ if(layerDrag && layerDrag.moved) return; activeId=l.id; renderLayerList(); syncLayerControls(); });
      handle.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); startLayerDrag(ev,l.id,item,handle); });
      list.appendChild(item);
    }
    syncLayerControls();
  }

  // ---------- pointer-based layer reordering (works with pen / touch / mouse) ----------
  let layerDrag=null;
  function startLayerDrag(e,id,item,handle){
    layerDrag={ id, item, handle, startY:e.clientY, active:false, moved:false, targetId:null, below:false, pid:e.pointerId };
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  }
  function clearDropMarks(){ document.querySelectorAll('#layerList .layer-item').forEach(x=>x.classList.remove('drop-above','drop-below')); }
  function updateLayerDropTarget(clientY){
    clearDropMarks();
    const items=Array.from(document.querySelectorAll('#layerList .layer-item'));
    let target=null, below=false;
    for(const el of items){ const r=el.getBoundingClientRect();
      if(clientY < r.top + r.height/2){ target=el; below=false; break; }
      target=el; below=true;
    }
    if(target){ target.classList.add(below?'drop-below':'drop-above'); layerDrag.targetId=+target.dataset.id; layerDrag.below=below; }
    else { layerDrag.targetId=null; }
  }
  function reorderLayer(dragId,targetId,below){
    if(targetId==null) return;
    const visual=layers.slice().reverse();               // 画面表示順(上→下)
    const dragObj=visual.find(x=>x.id===dragId); if(!dragObj) return;
    visual.splice(visual.indexOf(dragObj),1);
    let ti=visual.findIndex(x=>x.id===targetId);
    if(ti<0){ visual.push(dragObj); } else { visual.splice(below?ti+1:ti,0,dragObj); }
    layers=visual.reverse();
    activeId=dragId; renderLayerList(); redraw(); pushHistory();
  }
  function endLayerDrag(){
    if(!layerDrag) return;
    const d=layerDrag; layerDrag=null;
    clearDropMarks();
    document.querySelectorAll('#layerList .layer-item').forEach(x=>x.classList.remove('dragging'));
    document.body.style.cursor='';
    if(d.active && d.targetId!=null && d.targetId!==d.id){ reorderLayer(d.id,d.targetId,d.below); }
    // keep moved flag briefly so the trailing click on the handle's item doesn't re-select wrongly
    if(d.moved){ layerDrag={moved:true}; setTimeout(()=>{ layerDrag=null; },0); }
  }
  window.addEventListener('pointermove',e=>{
    if(!layerDrag || layerDrag.item===undefined) return;
    if(!layerDrag.active){ if(Math.abs(e.clientY-layerDrag.startY)<4) return; layerDrag.active=true; layerDrag.moved=true; layerDrag.item.classList.add('dragging'); document.body.style.cursor='grabbing'; }
    e.preventDefault();
    updateLayerDropTarget(e.clientY);
  });
  window.addEventListener('pointerup',()=>{ if(layerDrag && layerDrag.item!==undefined) endLayerDrag(); });
  window.addEventListener('pointercancel',()=>{ if(layerDrag && layerDrag.item!==undefined) endLayerDrag(); });
  function updateThumb(l){ if(l&&l._thumb){ const c=l._thumb.getContext('2d'); c.clearRect(0,0,40,32); c.drawImage(l.canvas,0,0,40,32); } }
  function syncLayerControls(){ const l=activeLayer(); if(!l)return; document.getElementById('layerOpacity').value=Math.round(l.opacity*100);
    document.getElementById('layerOpacityVal').textContent=Math.round(l.opacity*100)+'%'; document.getElementById('layerMode').value=l.mode; }

  // ---------- color ----------
  const PALETTE=['#000000','#4d4d4d','#999999','#e6e6e6','#ffffff','#7a3b16','#c0632a','#ffd27f','#e2795f','#d63b3b','#ff8fb3','#ffd24b','#8bc34a','#2fae6a','#4bb3d4','#2f6bb8','#6f4bd4','#b34bd4','#3a4a54','#5a7080'];
  let recentColors=[];
  let myColors=[];
  let palEditMode=false;
  try{ const saved=localStorage.getItem('drawr-mypalette'); if(saved)myColors=JSON.parse(saved)||[]; }catch(e){}

  // basic palette is built ONCE and never rebuilt (so swatches never shift)
  function buildBasicPalette(){ const pal=document.getElementById('palette'); pal.innerHTML='';
    PALETTE.forEach(c=>pal.appendChild(mkSwatch(c))); }
  function mkSwatch(c){ const d=document.createElement('div'); d.className='sw'; d.style.background=c; d.title=c; d.dataset.c=c;
    d.addEventListener('click',()=>setColor(c)); return d; }

  // recent row: fixed 8 slots, only this row updates when a color is committed
  function renderRecent(){ const pal=document.getElementById('recentPalette'); pal.innerHTML='';
    for(let i=0;i<8;i++){ const c=recentColors[i];
      if(c){ pal.appendChild(mkSwatch(c)); }
      else { const e=document.createElement('div'); e.className='sw empty'; pal.appendChild(e); } } }

  function renderMyPalette(){ const pal=document.getElementById('myPalette'); pal.className='palette'+(palEditMode?' editing':''); pal.innerHTML='';
    if(!myColors.length){ const e=document.createElement('div'); e.className='sw empty'; e.style.gridColumn='1 / -1'; e.style.aspectRatio='auto'; e.style.height='24px';
      e.textContent=''; pal.appendChild(e); return; }
    myColors.forEach((c,idx)=>{ const d=document.createElement('div'); d.className='sw'; d.style.background=c; d.title=c;
      d.addEventListener('click',()=>{ if(palEditMode){ myColors.splice(idx,1); saveMyPalette(); renderMyPalette(); } else setColor(c); }); pal.appendChild(d); }); }
  function saveMyPalette(){ try{ localStorage.setItem('drawr-mypalette',JSON.stringify(myColors)); }catch(e){} }

  // addRecent=false while dragging the native picker, so the palette doesn't churn/flicker
  function setColor(hex, addRecent){
    if(addRecent===undefined) addRecent=true;
    hex=hex.toLowerCase(); tool.color=hex;
    document.getElementById('colorPicker').value=hex;
    document.getElementById('hexInput').value=hex.toUpperCase();
    document.getElementById('swatchBig').style.background=hex;
    if(addRecent){ recentColors=recentColors.filter(c=>c!==hex); recentColors.unshift(hex); recentColors=recentColors.slice(0,8); renderRecent(); }
  }

  // ---------- PNG tEXt embed ----------
  const crcTable=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function insertTextChunk(bytes,keyword,text){
    const enc=new TextEncoder(); const kw=enc.encode(keyword), tx=enc.encode(text);
    const data=new Uint8Array(kw.length+1+tx.length); data.set(kw,0); data[kw.length]=0; data.set(tx,kw.length+1);
    const type=enc.encode('tEXt'); const typeData=new Uint8Array(type.length+data.length); typeData.set(type,0); typeData.set(data,type.length);
    const chunk=new Uint8Array(4+typeData.length+4); const dv=new DataView(chunk.buffer);
    dv.setUint32(0,data.length); chunk.set(typeData,4); dv.setUint32(4+typeData.length,crc32(typeData));
    const iendPos=bytes.length-12; const out=new Uint8Array(bytes.length+chunk.length);
    out.set(bytes.subarray(0,iendPos),0); out.set(chunk,iendPos); out.set(bytes.subarray(iendPos),iendPos+chunk.length); return out;
  }
  function extractTextChunk(bytes,keyword){
    const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); const dec=new TextDecoder(); let off=8;
    while(off<bytes.length-4){ const len=dv.getUint32(off); const type=dec.decode(bytes.subarray(off+4,off+8));
      if(type==='tEXt'){ const d=bytes.subarray(off+8,off+8+len); const z=d.indexOf(0);
        if(dec.decode(d.subarray(0,z))===keyword) return dec.decode(d.subarray(z+1)); }
      if(type==='IEND')break; off+=12+len; } return null;
  }

  function exportCanvas(){ const out=document.createElement('canvas'); out.width=CW; out.height=CH; const o=out.getContext('2d');
    o.fillStyle='#ffffff'; o.fillRect(0,0,CW,CH);
    for(const l of layers){ if(!l.visible||l.opacity<=0)continue; o.globalAlpha=l.opacity; o.globalCompositeOperation=l.mode; o.drawImage(l.canvas,0,0); }
    o.globalAlpha=1; o.globalCompositeOperation='source-over'; return out; }

  function save(){
    const out=exportCanvas();
    const payload={ v:1, w:CW, h:CH,
      layers: layers.map(l=>({id:l.id,name:l.name,opacity:l.opacity,mode:l.mode,visible:l.visible})),
      events: currentEvents() };
    out.toBlob(blob=>{
      blob.arrayBuffer().then(buf=>{
        let bytes=new Uint8Array(buf);
        try{ const json=JSON.stringify(payload); bytes=insertTextChunk(bytes,'drawrTimelapse',json); }catch(err){ console.warn(err); }
        const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
        const a=document.createElement('a'); a.href=url; a.download='drawr_'+Date.now()+'.png'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),2000);
        toast('過程つきPNGを保存しました');
      });
    },'image/png');
  }

  // ---------- open file ----------
  function openFile(file){
    const reader=new FileReader();
    reader.onload=()=>{ const buf=reader.result; const bytes=new Uint8Array(buf);
      let rec=null; try{ const json=extractTextChunk(bytes,'drawrTimelapse'); if(json)rec=JSON.parse(json); }catch(err){ console.warn(err); }
      if(rec&&rec.events&&rec.events.length){ openPlayer(rec); }
      else { // plain image -> load onto a new layer
        const img=new Image(); const url=URL.createObjectURL(new Blob([bytes]));
        img.onload=()=>{ if(img.width>CW||img.height>CH){ CW=Math.max(CW,img.width); CH=Math.max(CH,img.height); resizeAll(); }
          const l=addLayer({name:'よみこみ画像'}); l.ctx.drawImage(img,0,0); updateThumb(l); redraw(); pushHistory(); URL.revokeObjectURL(url); toast('画像を読み込みました(過程データなし)'); };
        img.src=url;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- playback ----------
  const player=document.getElementById('player');
  const playCanvas=document.getElementById('playCanvas');
  const pctx=playCanvas.getContext('2d');
  let play=null;   // {rec, pw, ph, layers:[{id,canvas,ctx,opacity,mode,visible}], atoms, total, idx, playing, speed, base, strokeTmp, active}
  let playRAF=null;

  function buildAtoms(rec){
    // each atom: {ev, k}  where k is point index for strokes, or -1 for fill/clear
    const atoms=[];
    rec.events.forEach(ev=>{
      if(ev.t==='st'){ const n=ev.pts.length/2; for(let k=0;k<n;k++) atoms.push({ev,k}); }
      else atoms.push({ev,k:-1});
    });
    return atoms;
  }
  function openPlayer(rec){
    play={ rec, pw:rec.w, ph:rec.h };
    playCanvas.width=rec.w; playCanvas.height=rec.h;
    play.strokeTmp=document.createElement('canvas'); play.strokeTmp.width=rec.w; play.strokeTmp.height=rec.h; play.stctx=play.strokeTmp.getContext('2d');
    play.scratch=document.createElement('canvas'); play.scratch.width=rec.w; play.scratch.height=rec.h; play.scctx=play.scratch.getContext('2d');
    resetPlayLayers();
    play.atoms=buildAtoms(rec); play.total=play.atoms.length; play.idx=0; play.playing=false; play.speed=1; play.active=null;
    document.getElementById('pSeek').max=Math.max(1,play.total);
    document.getElementById('pSeek').value=0; document.getElementById('pSpeed').value='1';
    document.getElementById('pPlay').innerHTML='&#9654;';
    renderPlay(); updatePTime();
    player.classList.add('open');
    // autoplay
    setTimeout(()=>{ togglePlay(true); },250);
  }
  function resetPlayLayers(){
    play.layers = play.rec.layers.map(m=>{ const c=document.createElement('canvas'); c.width=play.pw; c.height=play.ph;
      return { id:m.id, canvas:c, ctx:c.getContext('2d'), opacity:m.opacity, mode:m.mode, visible:m.visible }; });
    play.idx=0; play.active=null; if(play.stctx)play.stctx.clearRect(0,0,play.pw,play.ph);
  }
  function playLayer(id){ return play.layers.find(l=>l.id===id); }

  function endActiveStroke(){
    if(!play.active)return; const a=play.active, l=playLayer(a.lid);
    if(l){ l.ctx.save(); l.ctx.globalAlpha=a.op; l.ctx.globalCompositeOperation=(a.tool==='eraser')?'destination-out':'source-over';
      l.ctx.drawImage(play.strokeTmp,0,0); l.ctx.restore(); }
    play.stctx.clearRect(0,0,play.pw,play.ph); play.active=null;
  }

  function stepForward(){
    const atom=play.atoms[play.idx]; if(!atom)return; const ev=atom.ev;
    if(ev.t==='fill'){ endActiveStroke(); const l=playLayer(ev.lid); if(l){
        let match=l.canvas;
        if(ev.refIds&&ev.refIds.length){ const refs=ev.refIds.map(id=>playLayer(id)).filter(Boolean); if(refs.length) match=buildRefCanvas(refs,play.pw,play.ph); }
        bucketFill(match,l.ctx,ev.x,ev.y,ev.color,ev.op,play.pw,play.ph);
      } }
    else if(ev.t==='clear'){ endActiveStroke(); const l=playLayer(ev.lid); if(l)l.ctx.clearRect(0,0,play.pw,play.ph); }
    else if(ev.t==='move'){ endActiveStroke(); const l=playLayer(ev.lid); if(l){ const t=document.createElement('canvas'); t.width=play.pw; t.height=play.ph; t.getContext('2d').drawImage(l.canvas,0,0); l.ctx.clearRect(0,0,play.pw,play.ph); l.ctx.drawImage(t,ev.dx,ev.dy); } }
    else if(ev.t==='st'){
      if(atom.k===0){ endActiveStroke(); play.active={lid:ev.lid,op:ev.op,tool:ev.tool,color:ev.color,size:ev.size,seed:ev.seed||1};
        play.stctx.clearRect(0,0,play.pw,play.ph);
        const p={x:ev.pts[0],y:ev.pts[1]};
        play.stctx.strokeStyle=ev.color; play.stctx.fillStyle=ev.color;
        if(ev.tool==='airbrush') airStampInto(play.stctx,ev.color,ev.size,p,(ev.seed||1));
        else { wetSeg(play.stctx,ev.tool,ev.color,ev.size,p,{x:p.x+0.01,y:p.y},ev.shape,ev.angle);
          if(ev.binary){ const bb=segBBox(p,p,ev.size); thresholdRegion(play.stctx,bb.x,bb.y,bb.w,bb.h); } }
      } else {
        const a={x:ev.pts[(atom.k-1)*2],y:ev.pts[(atom.k-1)*2+1]}, b={x:ev.pts[atom.k*2],y:ev.pts[atom.k*2+1]};
        play.stctx.strokeStyle=ev.color; play.stctx.fillStyle=ev.color;
        if(ev.tool==='airbrush') airStampInto(play.stctx,ev.color,ev.size,b,(ev.seed||1)+atom.k);
        else { wetSeg(play.stctx,ev.tool,ev.color,ev.size,a,b,ev.shape,ev.angle);
          if(ev.binary){ const bb=segBBox(a,b,ev.size); thresholdRegion(play.stctx,bb.x,bb.y,bb.w,bb.h); } }
      }
      // if last point of stroke, flatten
      if(atom.k===ev.pts.length/2-1){ endActiveStroke(); }
    }
    play.idx++;
  }

  function renderPlay(){
    pctx.clearRect(0,0,play.pw,play.ph);
    pctx.fillStyle='#ffffff'; pctx.fillRect(0,0,play.pw,play.ph);
    for(const l of play.layers){
      if(!l.visible||l.opacity<=0)continue;
      pctx.globalAlpha=l.opacity; pctx.globalCompositeOperation=l.mode;
      if(play.active&&play.active.lid===l.id){
        play.scctx.clearRect(0,0,play.pw,play.ph); play.scctx.drawImage(l.canvas,0,0);
        play.scctx.save(); play.scctx.globalAlpha=play.active.op; play.scctx.globalCompositeOperation=(play.active.tool==='eraser')?'destination-out':'source-over';
        play.scctx.drawImage(play.strokeTmp,0,0); play.scctx.restore();
        pctx.drawImage(play.scratch,0,0);
      } else pctx.drawImage(l.canvas,0,0);
    }
    pctx.globalAlpha=1; pctx.globalCompositeOperation='source-over';
  }

  function seekTo(target){
    target=Math.max(0,Math.min(play.total,target));
    if(target<play.idx){ resetPlayLayers(); }
    while(play.idx<target){ stepForward(); }
    renderPlay(); document.getElementById('pSeek').value=play.idx; updatePTime();
  }
  function updatePTime(){ document.getElementById('pTime').textContent=play.idx+' / '+play.total; }

  function tick(){
    if(!play||!play.playing){ playRAF=null; return; }
    const stepsPerFrame=Math.max(1,Math.round(play.speed*3));
    for(let i=0;i<stepsPerFrame&&play.idx<play.total;i++) stepForward();
    renderPlay(); document.getElementById('pSeek').value=play.idx; updatePTime();
    if(play.idx>=play.total){ play.playing=false; document.getElementById('pPlay').innerHTML='&#9654;'; playRAF=null; return; }
    playRAF=requestAnimationFrame(tick);
  }
  function togglePlay(force){
    if(!play)return;
    const want = (force===true)?true:(force===false?false:!play.playing);
    if(want){ if(play.idx>=play.total){ seekTo(0); } play.playing=true; document.getElementById('pPlay').innerHTML='&#10073;&#10073;'; if(!playRAF)playRAF=requestAnimationFrame(tick); }
    else { play.playing=false; document.getElementById('pPlay').innerHTML='&#9654;'; }
  }
  function closePlayer(){ if(play)play.playing=false; if(playRAF){cancelAnimationFrame(playRAF);playRAF=null;} player.classList.remove('open'); }

  function loadRecIntoEditor(){
    if(!play)return; const rec=play.rec;
    CW=rec.w; CH=rec.h; setCanvasSize();
    // rebuild layers from record's final layer meta, replay all events into them
    layerSeq=0;
    layers=rec.layers.map(m=>{ const l=makeLayer(m.name); l.id=m.id; l.opacity=m.opacity; l.mode=m.mode; l.visible=m.visible; if(m.id>layerSeq)layerSeq=m.id; return l; });
    // replay events fully
    const strokeTmp=document.createElement('canvas'); strokeTmp.width=CW; strokeTmp.height=CH; const stc=strokeTmp.getContext('2d');
    rec.events.forEach(ev=>{
      const l=layers.find(x=>x.id===ev.lid); if(!l)return;
      if(ev.t==='fill'){ let match=l.canvas; if(ev.refIds&&ev.refIds.length){ const refs=ev.refIds.map(id=>layers.find(x=>x.id===id)).filter(Boolean); if(refs.length) match=buildRefCanvas(refs,CW,CH); } bucketFill(match,l.ctx,ev.x,ev.y,ev.color,ev.op,CW,CH); }
      else if(ev.t==='clear'){ l.ctx.clearRect(0,0,CW,CH); }
      else if(ev.t==='move'){ const mv=document.createElement('canvas'); mv.width=CW; mv.height=CH; mv.getContext('2d').drawImage(l.canvas,0,0); l.ctx.clearRect(0,0,CW,CH); l.ctx.drawImage(mv,ev.dx,ev.dy); }
      else if(ev.t==='st'){ stc.clearRect(0,0,CW,CH); stc.strokeStyle=ev.color; stc.fillStyle=ev.color; const n=ev.pts.length/2;
        if(ev.tool==='airbrush'){ for(let k=0;k<n;k++) airStampInto(stc,ev.color,ev.size,{x:ev.pts[k*2],y:ev.pts[k*2+1]},(ev.seed||1)+k); }
        else { if(n===1){ wetSeg(stc,ev.tool,ev.color,ev.size,{x:ev.pts[0],y:ev.pts[1]},{x:ev.pts[0]+0.01,y:ev.pts[1]},ev.shape,ev.angle); }
          for(let k=1;k<n;k++) wetSeg(stc,ev.tool,ev.color,ev.size,{x:ev.pts[(k-1)*2],y:ev.pts[(k-1)*2+1]},{x:ev.pts[k*2],y:ev.pts[k*2+1]},ev.shape,ev.angle);
          if(ev.binary) thresholdRegion(stc,0,0,CW,CH); }
        l.ctx.save(); l.ctx.globalAlpha=ev.op; l.ctx.globalCompositeOperation=(ev.tool==='eraser')?'destination-out':'source-over'; l.ctx.drawImage(strokeTmp,0,0); l.ctx.restore();
      }
    });
    activeId=layers.length?layers[layers.length-1].id:null;
    record=JSON.parse(JSON.stringify(rec)); // continue recording from here
    history.length=0; histIndex=-1;
    renderLayerList(); redraw(); fitZoom(); pushHistory();
    closePlayer(); toast('この絵を編集モードで開きました');
  }

  // replay current in-editor drawing
  function replayCurrent(){
    const evs=currentEvents();
    if(!evs.length){ toast('まだ描いていません'); return; }
    const payload={ v:1, w:CW, h:CH,
      layers: layers.map(l=>({id:l.id,name:l.name,opacity:l.opacity,mode:l.mode,visible:l.visible})),
      events: evs };
    openPlayer(JSON.parse(JSON.stringify(payload)));
  }

  // ---------- init ----------
  function init(){
    try{ const t=localStorage.getItem('drawr-theme'); if(t==='dark'){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').innerHTML='&#9728;'; } }catch(e){}
    setCanvasSize();
    const base=makeLayer('レイヤー 1'); base.ctx.fillStyle='#ffffff'; base.ctx.fillRect(0,0,CW,CH);
    layers=[base]; activeId=base.id;
    record={ v:1, w:CW, h:CH, layers:[], events:[] };
    buildBasicPalette(); renderRecent(); renderMyPalette(); buildSizePresets(); buildRzPresets();
    setColor('#3a4a54',false); renderLayerList(); redraw(); fitZoom();
    selectTool('pen'); pushHistory(); updateUndoRedo();
  }
  init();
})();
</script>
